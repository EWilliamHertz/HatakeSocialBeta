[supervisord]
nodaemon=true

[program:nextjs]
command=node server.js
directory=/app
autostart=true
autorestart=true
environment=NODE_ENV="production",NODE_OPTIONS="--max-old-space-size=96"
stderr_logfile=/var/log/nextjs.err.log
stdout_logfile=/var/log/nextjs.out.log

[program:phase-server]
command=/usr/local/bin/phase-server-start.sh
directory=/app/phase-engine
autostart=true
autorestart=true
environment=PORT="9374",RUST_LOG="info"
stderr_logfile=/var/log/phase.err.log
stdout_logfile=/var/log/phase.out.log
